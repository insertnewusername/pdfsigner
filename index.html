<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Signer</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Load libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
  <!-- SVG Filter exactly as your demo -->
  <svg style="display: none">
    <filter id="lg-dist" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="70" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="app">
    <!-- Toolbar (Liquid Glass) -->
    <header class="toolbar glass-container">
      <div class="glass-filter"></div>
      <div class="glass-overlay"></div>
      <div class="glass-specular"></div>
      <div class="glass-content toolbar-content">
        <div class="brand">
          <span class="brand-icon">✍️</span>
          <span class="brand-text">PDF Signer</span>
        </div>

        <div class="toolbar-group">
          <label class="file-btn">
            <span>📄 Load PDF</span>
            <input type="file" id="pdfInput" accept="application/pdf" hidden />
          </label>
          <span id="fileStatus" class="file-status">No PDF loaded</span>
        </div>

        <div class="toolbar-spacer"></div>

        <div class="toolbar-group">
          <button id="addSignatureBtn" class="btn btn-secondary" disabled>+ Signature</button>
          <button id="addDateBtn" class="btn btn-secondary" disabled>+ Date</button>
          <button id="downloadBtn" class="btn btn-primary" disabled>⬇ Download PDF</button>
        </div>
      </div>
    </header>

    <div id="errorBanner" class="error-banner" hidden>
      <span id="errorBannerText" class="error-banner-text"></span>
      <button id="errorBannerClose" type="button" class="error-banner-close" aria-label="Dismiss">×</button>
    </div>

    <div class="workspace">
      <!-- PDF Viewer -->
      <main class="viewer" id="pdfViewer">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">📄</div>
          <h2>No PDF loaded</h2>
          <p>Click <strong>Load PDF</strong> above to begin.</p>
        </div>
        <div id="pagesContainer" class="pages-container"></div>
      </main>

      <!-- Sidebar (Liquid Glass Panels) -->
      <aside class="sidebar">
        <div class="sidebar-scroll">
          
          <section class="panel glass-container">
            <div class="glass-filter"></div>
            <div class="glass-overlay"></div>
            <div class="glass-specular"></div>
            <div class="glass-content panel-content">
              <h3>✍️ Signatures</h3>
              
              <div class="field">
                <label>Your signatures</label>
                <div id="sigLibrary" class="sig-library empty">
                  <span>No signatures yet</span>
                </div>
              </div>

              <div class="field">
                <label>Add new</label>
                <div id="sigPreview" class="sig-preview empty">
                  <span>No PNG loaded</span>
                </div>
                <label class="file-btn file-btn-full">
                  <span>Choose PNG</span>
                  <input type="file" id="signatureInput" accept="image/png" hidden />
                </label>
              </div>

              <div class="grid-2">
                <div class="field">
                  <label>Width (pt)</label>
                  <input type="number" id="sigWidthInput" value="150" min="20" max="800" step="1" />
                </div>
                <div class="field">
                  <label>Height (pt)</label>
                  <input type="number" id="sigHeightInput" value="60" min="20" max="400" step="1" />
                </div>
              </div>
              <button id="applySigSizeBtn" class="btn btn-secondary btn-block" disabled>
                Apply size
              </button>
            </div>
          </section>

          <section class="panel glass-container">
            <div class="glass-filter"></div>
            <div class="glass-overlay"></div>
            <div class="glass-specular"></div>
            <div class="glass-content panel-content">
              <h3>📅 Date Box</h3>
              <div class="field">
                <label>Date text</label>
                <input type="text" id="dateTextInput" placeholder="e.g. 2025-03-21" />
              </div>
              <div class="grid-2">
                <div class="field">
                  <label>Font</label>
                  <select id="dateFontSelect">
                    <option value="Helvetica">Helvetica</option>
                    <option value="Helvetica-Bold">Helvetica Bold</option>
                    <option value="Times-Roman">Times Roman</option>
                    <option value="Times-Bold">Times Bold</option>
                    <option value="Courier">Courier</option>
                    <option value="Courier-Bold">Courier Bold</option>
                  </select>
                </div>
                <div class="field">
                  <label>Size (pt)</label>
                  <input type="number" id="dateFontSizeInput" value="16" min="8" max="72" step="1" />
                </div>
              </div>
              <button id="updateDateBtn" class="btn btn-secondary btn-block" disabled>
                Update date
              </button>
            </div>
          </section>

          <section class="panel glass-container">
            <div class="glass-filter"></div>
            <div class="glass-overlay"></div>
            <div class="glass-specular"></div>
            <div class="glass-content panel-content">
              <h3>🗑️ Selected</h3>
              <button id="deleteSelectedBtn" class="btn btn-danger btn-block" disabled>
                Delete selected
              </button>
            </div>
          </section>

        </div>
      </aside>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
